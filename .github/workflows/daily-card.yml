name: daily-card

# Runs the whole pipeline twice a day and commits the card + history back to the repo.
# 15:00 UTC = 10am ET (morning card); 23:00 UTC = 6pm ET (fresh lines just before most games,
# which also become the "closing line" used to judge picks).
on:
  schedule:
    - cron: "0 15,23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-card
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m sportsedge run
      - name: Commit card and history
        run: |
          git config user.name "sportsedge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history reports
          git commit -m "Daily card $(date -u +%F' '%H:%MZ)" || exit 0
          git pull --rebase
          git push
